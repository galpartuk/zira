name: zira
description: "זירה — ניהול טורנירים: סוויס, ראונד רובין, טופ קאט, חלוקת פרסים וכלי משחק."
publish_to: 'none'
version: 1.5.5+22

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo.ttf
